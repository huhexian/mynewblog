baseURL = "https://yinji.org/"
locale = "zh-CN"
title = "印记"
theme = "hugo-theme-icy"
defaultContentLanguage = "zh-cn"
mainSections = ["blog"]
hasCJKLanguage = true
enableRobotsTXT = true
copyright = "Copyright © 2018-2026, huhexian."

[uglyURLs]
  blog = true
[permalinks]
  blog = "/:contentbasename"
  tags = "/tags/:slug"
[outputs]
  home = ["HTML", "RSS"]
[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"
[services.rss]
  limit = 20
[pagination]
  pagerSize = 10
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
    block = true
[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
[markup.goldmark.renderer]
  unsafe = true

[[menus.main]]
  name = "文章"
  pageRef = "/blog"
  weight = 10
[[menus.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 20

[params]
  description = "Live a life you will remember."
  # Site overrides: remote images load in the browser; missing legacy files show a notice.
  remoteImagesAtBuild = false
  legacyMissingImages = true
  [params.author]
    name = "青山"
    email = "me@yinji.org"
    avatar = '/avatar.png'
    bio = '一位人力资源管理从业者，Blogger/摄影爱好者/数码发烧友。'
  [[params.social]]
    name = 'github'
    title = 'GitHub'
    url = 'https://github.com/huhexian'
  [[params.social]]
    name = 'x'
    title = 'X'
    url = 'https://x.com/huhexian'
  [[params.social]]
    name = 'telegram'
    title = 'Telegram'
    url = 'https://t.me/findblog'
  [params.home]
    intro = true
    recentCount = 8
  [params.list]
    groupByYear = true
    paginate = true
  [params.article]
    toc = true
    imageViewer = true
  [params.footer]
    since = 2018
  [[params.social]]
    name = "rss"
    title = "RSS"
    url = "/feed.xml"